<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조합원 현황판</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        body {
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
            background-color: transparent; /* 배경 투명하게 (구글 사이트 배경 따라감) */
            margin: 0;
            padding: 10px;
        }

        /* 메인 컨테이너: 반응형 핵심 */
        .container {
            display: flex;
            flex-direction: row; /* 기본은 가로 정렬 */
            justify-content: space-around;
            align-items: flex-start;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
            background-color: #e0e0e0; /* 올려주신 이미지의 회색 배경 */
            padding: 30px 20px;
            border-radius: 10px; /* 모서리 둥글게 */
        }

        .stat-box {
            flex: 1; /* 공간을 1:1로 차지 */
            text-align: center;
            min-width: 250px; /* 너무 좁아지면 줄바꿈 유도 */
        }

        .stat-label {
            color: #555;
            font-size: 15px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 48px;
            font-weight: 800;
            color: #333;
            margin-bottom: 10px;
            letter-spacing: -1px;
            line-height: 1;
        }

        .unit {
            font-size: 24px;
            font-weight: 600;
            margin-left: 2px;
            color: #555;
        }

        .text-orange {
            color: #ff9800; /* 오렌지색 포인트 */
        }

        /* 하단 상세 정보 (개인/단체) */
        .sub-info {
            display: inline-block;
            background-color: #efefef;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #777;
            margin-top: 5px;
        }
        
        .sub-item {
            display: inline-block;
            margin: 0 5px;
        }
        
        .sub-item strong {
            color: #444;
        }

        /* 구분선 (PC에서만 보임) */
        .divider {
            width: 1px;
            height: 80px;
            background-color: #ccc;
            margin-top: 10px;
        }

        /* 📱 모바일 최적화 (화면 폭 600px 이하일 때) */
        @media (max-width: 600px) {
            .container {
                flex-direction: column; /* 세로 정렬로 변경 */
                align-items: center;
                gap: 40px; /* 위아래 간격 벌림 */
            }
            
            .divider {
                display: none; /* 모바일에서는 구분선 숨김 */
            }

            .stat-value {
                font-size: 40px; /* 숫자 크기 살짝 조정 */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="stat-box">
            <div class="stat-label">현재 조합원</div>
            <div class="stat-value">
                <span id="totalMember">0</span><span class="unit">명</span>
            </div>
            <div class="sub-info">
                <span class="sub-item">개인 <strong id="indivCount">0</strong>명</span>
                <span class="sub-item">단체 <strong id="groupCount">0</strong>개소</span>
            </div>
        </div>

        <div class="divider"></div>

        <div class="stat-box">
            <div class="stat-label">모인 에너지 기금</div>
            <div class="stat-value text-orange">
                <span id="totalMoney">0</span><span class="unit">원</span>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 배포하신 앱스크립트 URL 확인 (exec로 끝나는지 확인!)
        const API_URL = "https://script.google.com/macros/s/AKfycbxORygvyjV_p1YGh0wFm4BkMbuWYxgyAuhRL1_3SCzLcOJb3JMZupIUSLZtZdTatWxZ/exec";

        // 숫자 3자리마다 콤마 찍는 함수
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // 데이터 불러오기
        async function loadStats() {
            try {
                // Main.gs의 doGet(?action=getStats)를 호출
                const response = await fetch(API_URL + "?action=getStats");
                const data = await response.json();

                // 데이터 적용 (애니메이션 효과 없음, 즉시 적용)
                document.getElementById('indivCount').innerText = formatNumber(data.individual);
                document.getElementById('groupCount').innerText = formatNumber(data.group);
                
                // 총 인원 = 개인 + 단체
                const total = Number(data.individual) + Number(data.group);
                document.getElementById('totalMember').innerText = formatNumber(total);

                document.getElementById('totalMoney').innerText = formatNumber(data.amount);

            } catch (error) {
                console.error("데이터 로딩 실패:", error);
                document.getElementById('totalMember').innerText = "-";
                document.getElementById('totalMoney').innerText = "-";
            }
        }

        // 시작!
        loadStats();
    </script>

</body>
</html>
