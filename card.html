<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        background-color: transparent;
        margin: 0; padding: 0; text-align: center; overflow: hidden;
      }
      .container { padding: 5px 0; }
      
      .number { font-weight: 800; line-height: 1.2; }
      .unit { font-size: 20px; font-weight: 600; color: #333; margin-left: 2px; }
      
      /* 메인 숫자 (크게) */
      .big-text { font-size: 48px; letter-spacing: -1px; }
      
      /* 하단 상세 내역 (작게) */
      .detail-row {
        margin-top: 8px; font-size: 15px; color: #777; font-weight: 500;
        display: flex; justify-content: center; align-items: center; gap: 10px;
      }
      .detail-item { background-color: #f5f5f5; padding: 4px 10px; border-radius: 12px; }
      .detail-num { font-weight: 700; color: #555; }
      
      /* 색상 클래스 */
      .default-text { color: #333; }
      .money-text { color: #ff8c00; }
      
      /* 로딩 중일 때 흐릿하게 */
      .loading { opacity: 0.5; }
    </style>
  </head>
  <body>
    <div class="container" id="contentArea">
      <div class="number big-text default-text loading">
        Loading...
      </div>
    </div>

    <script>
      // ⚠️ 여기에 배포한 앱스크립트 웹 앱 URL을 넣으세요!
      const API_URL = "https://script.google.com/macros/s/AKfycbxORygvyjV_p1YGh0wFm4BkMbuWYxgyAuhRL1_3SCzLcOJb3JMZupIUSLZtZdTatWxZ/exec";

      // URL 파라미터 확인 (?mode=view_amount 인지 확인)
      const urlParams = new URLSearchParams(window.location.search);
      const mode = urlParams.get('mode'); // 'view_count' or 'view_amount'

      // 애니메이션 함수 (선생님 기존 코드 유지)
      function animateValue(id, start, end, duration) {
        const obj = document.getElementById(id);
        if (!obj) return;
        if (start === end) { obj.innerHTML = end.toLocaleString('ko-KR'); return; }

        const range = end - start;
        let startTime = null;

        function step(currentTime) {
          if (!startTime) startTime = currentTime;
          const progress = Math.min((currentTime - startTime) / duration, 1);
          const currentVal = Math.floor(progress * range + start);
          obj.innerHTML = currentVal.toLocaleString('ko-KR');

          if (progress < 1) {
            window.requestAnimationFrame(step);
          } else {
            obj.innerHTML = end.toLocaleString('ko-KR');
          }
        }
        window.requestAnimationFrame(step);
      }

      // 데이터 가져오기 및 화면 그리기
      async function loadData() {
        try {
          const response = await fetch(API_URL + "?action=getStats");
          const data = await response.json();
          
          const val1 = parseInt(data.individual) || 0; // 개인
          const val2 = parseInt(data.group) || 0;      // 단체
          const amount = parseInt(data.amount) || 0;   // 금액
          const totalPeople = val1 + val2;             // 총 인원

          const container = document.getElementById('contentArea');
          
          if (mode === 'view_amount') {
            // [금액 모드 화면 그리기]
            container.innerHTML = `
              <div class="number big-text money-text">
                <span id="counter1">0</span><span class="unit">원</span>
              </div>
            `;
            animateValue("counter1", 0, amount, 1500);

          } else {
            // [인원수 모드 화면 그리기] - 기본값
            container.innerHTML = `
              <div class="number big-text default-text">
                <span id="counterTotal">0</span><span class="unit">명</span>
              </div>
              <div class="detail-row">
                <div class="detail-item">
                  개인 <span id="counter1" class="detail-num">0</span>명
                </div>
                <div class="detail-item">
                  단체 <span id="counter2" class="detail-num">0</span>개소
                </div>
              </div>
            `;
            animateValue("counterTotal", 0, totalPeople, 1500);
            animateValue("counter1", 0, val1, 1500);
            animateValue("counter2", 0, val2, 1500);
          }

        } catch (error) {
          console.error("데이터 로딩 실패:", error);
          document.getElementById('contentArea').innerHTML = `
            <div style="font-size:14px; color:red;">연결 실패</div>
          `;
        }
      }

      // 실행
      loadData();
    </script>
  </body>
</html>
